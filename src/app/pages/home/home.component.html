<div class="home-container">
  <h2>Welcome back : {{ username }}!</h2>
  <button mat-raised-button color="accent" routerLink="/workout" routerLinkActive="active">Start Workout</button>

  <app-active-workout
    *ngIf="activeWorkoutVisible"
    (minimize)="toggleWorkoutMinimize()"
    [minimized]="isWorkoutMinimized">
  </app-active-workout>
</div>
