<div 
  class="flex flex-col min-h-[100dvh] 
         bg-[url('/assets/gym-equipment-background-landscape_26727090.jpg')] 
         bg-cover bg-center bg-no-repeat 
         relative">

  <!-- Global Overlays -->
  <div class="absolute inset-0 backdrop-blur-[2px] bg-black/40"></div>
  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/60"></div>

  <!-- Header -->
  <header class="relative w-full h-14 sm:h-16 flex items-center justify-between px-6
                 bg-black/60 backdrop-blur-lg border-b border-white/10 z-20">

    <img src="assets/dumbbell-white.png" alt="IronLog" class="h-8 sm:h-9 object-contain select-none invert" />

    <button (click)="toggleTheme()"
      class="relative w-9 h-9 flex items-center justify-center rounded-lg
             hover:bg-white/10 transition-all overflow-hidden">
      <!-- Sun -->
      <svg class="absolute w-6 h-6 transition-all duration-500"
        [class.rotate-0]="!isDark"
        [class.rotate-90]="isDark"
        [class.scale-100]="!isDark"
        [class.scale-0]="isDark"
        xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="white">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m8.66-8.66h-1M4.34 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>

      <!-- Moon -->
      <svg class="absolute w-6 h-6 transition-all duration-500"
        [class.rotate-180]="!isDark"
        [class.rotate-0]="isDark"
        [class.scale-0]="!isDark"
        [class.scale-100]="isDark"
        xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="white">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>

  </header>

  <!-- Login Area -->
  <div class="relative flex-grow flex justify-center items-center pt-14 sm:pt-16 p-6 z-10">

    <div class="w-full max-w-md bg-white/10 dark:bg-black/30 backdrop-blur-xl 
                p-6 rounded-2xl shadow-lg border border-white/20">

      <h2 class="text-2xl font-semibold text-white mb-5 text-center">Login</h2>

      <form #loginForm="ngForm" (ngSubmit)="onLogin()" class="space-y-4">

        <input 
          type="email"
          placeholder="Email"
          class="w-full px-3 py-2 rounded-lg border border-white/20
                 focus:ring-2 focus:ring-white/40 outline-none 
                 bg-white/10 text-white placeholder:text-white/70"
          [(ngModel)]="email" name="email" required email #emailModel="ngModel"/>

        <p *ngIf="emailModel.invalid && emailModel.touched"
           class="text-red-300 text-sm -mt-2">Please enter a valid email.</p>

        <div class="relative">
          <input [type]="password_hide ? 'password' : 'text'" placeholder="Password"
                 class="w-full px-3 py-2 rounded-lg border border-white/20
                 focus:ring-2 focus:ring-white/40 outline-none 
                 bg-white/10 text-white placeholder:text-white/70"
                 [(ngModel)]="password" name="password" required minlength="6" #passwordModel="ngModel"/>

          <button type="button" (click)="password_hide = !password_hide"
                  class="absolute right-3 top-2.5 text-white/80 hover:text-white">
            <span class="material-icons text-lg">{{ password_hide ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>

        <p *ngIf="passwordModel.invalid && passwordModel.touched"
           class="text-red-300 text-sm -mt-2">Password must be 6+ characters.</p>

        <button type="submit" [disabled]="loginForm.invalid"
                class="w-full py-2.5 rounded-lg font-semibold text-black bg-white
                       hover:opacity-80 transition disabled:opacity-40">
          Login
        </button>

        <div *ngIf="errorMessage"
             class="bg-red-500/20 text-red-300 text-sm p-3 rounded-lg text-center">
          {{ errorMessage }}
        </div>

        <p class="text-sm text-center text-white/80">
          Don't have an account?
          <a routerLink="/register" class="text-white font-medium hover:underline">
            Signup
          </a>
        </p>

      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="relative mt-auto w-full py-4 bg-black/60 backdrop-blur-lg border-t border-white/10 text-white/80 z-20">
    <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-3 items-center px-4 gap-2 sm:gap-0">

      <nav class="flex gap-4 justify-center sm:justify-start flex-wrap">
        <a href="/about" class="hover:underline">About</a>
        <a href="/privacy" class="hover:underline">Privacy</a>
        <a href="/terms" class="hover:underline">Terms</a>
        <a href="/contact" class="hover:underline">Contact</a>
      </nav>

      <div class="flex justify-center">
        <p class="text-xs text-center">
          © {{ currentYear || 2025 }} IronLog • Lift Heavy. Be Strong. Track Smarter.
        </p>
      </div>

      <div class="flex justify-center sm:justify-end">
        <p class="text-sm">🚧 Work in progress</p>
      </div>

    </div>
  </footer>

</div>
