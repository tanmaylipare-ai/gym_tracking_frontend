<div class="workout-container" *ngIf="!workout; else activeWorkout">
  <h2>Start Workout</h2>
  <button mat-raised-button color="primary" (click)="startWorkout()">Start New Workout</button>
</div>

<ng-template #activeWorkout>
  <div class="active-workout">
    <div class="workout-header">
      <h2>Workout In Progress</h2>

      <div class="workout-controls">
        <button mat-stroked-button color="warn" (click)="discardWorkout()">Discard</button>
        <button mat-raised-button color="accent" (click)="completeWorkout()">Complete</button>
      </div>
    </div>

    <!-- Add Exercise (Pinned to top) -->
    <div class="add-exercise-section card">
      <button mat-stroked-button color="primary" (click)="toggleExerciseSearch()">
        {{ showExerciseSearch ? 'Hide Exercise Search' : 'Add Exercise' }}
      </button>

      <div class="exercise-search" *ngIf="showExerciseSearch">
        <input
          type="text"
          placeholder="Search exercises..."
          [formControl]="exerciseSearchControl"
          class="dropdown-search-input"
        />
        <div class="exercise-list" *ngIf="filteredExercises$ | async as filtered">
          <div
            *ngFor="let ex of filtered"
            class="exercise-item"
            (click)="addExercise(ex)"
          >
            <strong>{{ ex.name }}</strong>
            <span *ngIf="ex.description">{{ ex.description }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 🏋️‍♂️ Workout Exercises -->
    <div class="workout-exercises">
      <div *ngFor="let ex of workoutExercises" class="workout-exercise card">
        <div class="exercise-header">
          <h3>{{ ex.name }}</h3>
          <button mat-icon-button color="warn" (click)="removeExercise(ex)" title="Remove exercise">
            <mat-icon>delete</mat-icon>
          </button>
        </div>

        <!-- Existing Sets -->
        <div class="set-list">
          <div class="set-item" *ngFor="let s of ex.sets">
            <span>{{ s.reps }} reps × {{ s.weight }} kg</span>
            <button mat-icon-button color="warn" (click)="removeSet(ex, s.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>

        <!-- Add New Set Inline -->
        <div class="add-set-inline">
          <input type="number" min="1"placeholder="Reps" [(ngModel)]="ex.newSet.reps"/>
          <input type="number" min="0" placeholder="Weight (kg)" [(ngModel)]="ex.newSet.weight"/>
          <button mat-stroked-button color="primary" (click)="addSetInline(ex)">Add Set</button>
        </div>
      </div>
    </div>
  </div>
</ng-template>


<!-- -------------------------popup summary -->
 <!-- Workout Summary Popup -->
<div class="workout-summary-backdrop" *ngIf="showSummary">
  <div class="workout-summary-card">
    <h2>Workout Summary</h2>
    <div class="summary-details">
      <p><strong>Total Volume:</strong> {{ summaryData?.totalVolume }} kg</p>
      <p><strong>Total Sets:</strong> {{ summaryData?.totalSets }}</p>
      <div *ngIf="summaryData?.newPRs?.length">
        <h3>🏆 New Personal Bests:</h3>
        <ul>
          <li *ngFor="let pr of summaryData?.newPRs">{{ pr }}</li>
        </ul>
      </div>
    </div>
    <button mat-raised-button color="primary" (click)="closeSummary()">Close</button>
  </div>
</div>
